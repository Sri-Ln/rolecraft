name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck (JSDoc types via tsc)
        run: npm run typecheck -w core
      - name: Unit tests
        run: npm test -w core
      - name: Eval harness (quality gate)
        # Fails the build if required-skill precision/recall drops below EVAL_MIN.
        run: npm run evals -w core
